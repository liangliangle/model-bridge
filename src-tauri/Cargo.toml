[package]
name = "model-bridge"
version = "0.1.0"
edition = "2021"

[lib]
name = "model_bridge_lib"
path = "src/lib.rs"

[[bin]]
name = "model-bridge"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "preserve_order"] }
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
bytes = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
tower-http = { version = "0.6", features = ["cors", "fs", "set-header", "catch-panic"] }
parking_lot = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
